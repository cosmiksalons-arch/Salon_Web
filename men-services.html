<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Men's Services - COSMIK</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="menu-body">

    <!-- BACKGROUND ANIMATIONS -->
    <canvas id="bg-canvas"></canvas>
    <div class="bg-interactive"></div>
    <!-- OVERLAY & DRAWER -->
    <div id="overlay" onclick="toggleDrawer()"></div>
    <div id="mobile-drawer">
        <button class="close-drawer" onclick="toggleDrawer()">&times;</button>
        <div class="drawer-header"><h3>COSMIK</h3></div>
        <div class="drawer-links">
            <a href="index.html">Home</a>
            <a href="women-services.html">Women's Menu</a>
        </div>
    </div>

    <!-- HEADER -->
    <div class="menu-top-nav">
        <div class="hamburger-btn" onclick="toggleDrawer()"><i class="fas fa-bars"></i></div>
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> BACK</a>
        <div class="menu-page-title">MEN'S MENU</div>
        <div style="width: 24px;"></div>
    </div>

    <!-- DYNAMIC MENU CONTAINER -->
    <div class="menu-container" id="dynamic-menu">
        <!-- Content will be injected here by JS -->
    </div>

    <!-- FLOATING WHATSAPP BUTTON -->
        <!-- CHATBOT WIDGET -->
    <div id="chatbot-widget" class="chatbot-widget">
        <div class="chat-header">
            <span><i class="fas fa-robot"></i> Cosmik Assistant</span>
            <button id="close-chat" class="close-chat"><i class="fas fa-times"></i></button>
        </div>
        <div class="chat-body" id="chat-body">
            <!-- Messages injected by JS -->
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type your answer...">
            <button id="send-chat" class="send-chat"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
    
    <button id="chatbot-toggle" class="floating-wa">
        <i class="fab fa-whatsapp"></i> Book Now
    </button>

    <!-- SCRIPTS -->
    <script src="menu_data.js"></script>
    <script src="script.js"></script>
    <script>
        // Load Men's menu on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadMenu('Men');
        });
    </script>
</body>
</html>
